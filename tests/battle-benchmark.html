<!doctype html><html lang="en"><meta charset="utf-8"><title>Helion Divide / battle stress test</title>
<style>body{margin:0;background:#14232b;color:#dff6ee;font:13px monospace}canvas{position:fixed;inset:0}aside{position:fixed;top:15px;left:15px;background:#061721e6;border:1px solid #71c5bf;padding:16px;width:320px}button,select{background:#92eddf;color:#132b2d;padding:8px;border:0;margin:5px}pre{white-space:pre-wrap;line-height:1.5}a{color:#9be8dd}</style>
<canvas id="world"></canvas><aside><h2>80-unit battle stress test</h2><p>Dev only. Live simulation, projectiles and animation. Inflated hulls keep the sample at capacity. No game HUD or sound.</p><select id="quality"><option>low</option><option selected>medium</option><option>high</option></select><button id="run">Run 12-second sample</button><pre id="report">Ready.</pre><a href="/">Return to game</a></aside>
<script type="module">
import {World} from '/src/render.ts';import {Battle} from '/src/simulation.ts';import {KINDS} from '/src/data.ts';import {defaults} from '/src/save.ts';
const settings=defaults().settings,battle=new Battle({difficulty:'normal'});battle.state.units=[];battle.state.armies.forEach(a=>{a.order='attack';a.core=1e9});
for(const team of [0,1])for(let i=0;i<40;i++){const u=battle.spawn(KINDS[i%7],team,(team===0?-1:1)*(4+i%10*1.8),(i%5-2)*2);u.hp=1e7;}
const world=new World(document.querySelector('canvas'),settings);world.start(battle);world.focusMap(0);let previous=performance.now(),acc=0,samples=[],remaining=0,start=0;
const report=document.getElementById('report'),context=world.renderer.getContext(),ext=context.getExtension('WEBGL_debug_renderer_info'),gpu=ext?context.getParameter(ext.UNMASKED_RENDERER_WEBGL):'WebGL 2 renderer';
document.getElementById('quality').onchange=e=>{settings.quality=e.target.value;world.settings(settings);remaining=0;report.textContent='Ready. Quality: '+settings.quality;};
document.getElementById('run').onclick=()=>{samples=[];remaining=12;start=performance.now();};
function frame(now){const raw=(now-previous)/1000,dt=Math.min(.1,raw);previous=now;if(!document.hidden){acc+=dt;while(acc>=1/30){battle.tick(1/30);acc-=1/30;}world.showEvents(battle.takeEvents());world.update(dt,undefined,acc*30);if(remaining>0){samples.push(raw*1000);remaining-=raw;report.textContent='Sampling '+Math.max(0,remaining).toFixed(1)+'s · '+battle.state.units.length+' units';if(remaining<=0){samples.sort((a,b)=>a-b);const elapsed=(now-start)/1000;report.textContent=JSON.stringify({quality:settings.quality,units:battle.state.units.length,viewport:[innerWidth,innerHeight],pixelRatio:world.renderer.getPixelRatio(),gpu,sampleSeconds:+elapsed.toFixed(2),frames:samples.length,fps:+(samples.length/elapsed).toFixed(1),p95ms:+samples[Math.floor(samples.length*.95)].toFixed(2),projectiles:battle.state.projectiles.length,render:world.stats()},null,2);}}}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
